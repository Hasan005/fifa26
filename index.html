<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>World Cup 2026 — Live Scores, Schedule & Standings</title>
<meta name="description" content="FIFA World Cup 2026 live scores, results, full match schedule and group standings. Times shown in your local timezone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0C;
    --card:#151517;
    --card-edge:#26262A;
    --ink:#F4F1E8;
    --ink-dim:#9C998E;
    --gold:#E5B54B;          /* trophy gold — primary accent */
    --pitch:#34B86B;         /* Mexico green — qualification */
    --live:#FF5349;          /* Canada red — live matches */
    --us:#4A80F5;            /* USA blue — tricolor chip */
    --final:#8E8A7B;
    --radius:14px;
    --disp:'Oswald',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- header + tabs ---------- */
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(12px + env(safe-area-inset-top)) 16px 0;
    box-shadow:0 10px 14px -10px rgba(0,0,0,.6);
  }
  .masthead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h1{
    font-family:var(--disp);
    font-weight:700;font-size:21px;letter-spacing:.04em;
    text-transform:uppercase;line-height:1;
  }
  h1 .yr{color:var(--gold)}
  .sync{
    font-size:10.5px;color:var(--ink-dim);
    display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .sync .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
  .sync.stale .dot{background:#C25B4E}
  .hosts{font-size:10.5px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;
    display:flex;align-items:center;gap:8px}
  .hosts::before{
    content:"";flex:none;width:27px;height:9px;border-radius:2px 2px 2px 5px;
    background:linear-gradient(90deg,var(--us) 0 33.4%,var(--live) 33.4% 66.7%,var(--pitch) 66.7% 100%);
  }

  .tabs{display:flex;gap:8px;padding:12px 0 12px}
  .tab{
    font-family:var(--disp);font-weight:500;font-size:14px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-dim);
    background:var(--card);border:1px solid var(--card-edge);border-radius:999px;
    padding:8px 20px;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:background .15s,color .15s;
  }
  .tab.sel{background:var(--gold);border-color:var(--gold);color:#181203;font-weight:600}
  .tab:focus-visible{outline:2px solid var(--live);outline-offset:2px}
  .tab .badge{
    display:none;margin-left:7px;font-size:11px;font-weight:600;
    background:var(--live);color:#2B0805;border-radius:999px;padding:1px 7px;
    vertical-align:1px;
  }
  .tab.has-live .badge{display:inline-block}
  .tab.has-live:not(.sel){color:var(--ink);border-color:var(--live)}

  /* ---------- live tab extras ---------- */
  .scorers{
    display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;
    margin-top:9px;border-top:1px solid var(--card-edge);padding-top:8px;
    font-size:11.5px;color:var(--ink-dim);line-height:1.7;
  }
  .scorers .g{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scorers .g.away{text-align:right}
  .scorers .g .min{color:var(--gold);font-family:var(--disp);font-size:11px}
  .scorers .g .rc{color:#E0564A;font-weight:600}
  .next-card{
    background:var(--card);border:1px dashed var(--card-edge);
    border-radius:22px 10px 10px 10px;padding:16px;text-align:center;
    color:var(--ink-dim);font-size:13px;line-height:1.7;
  }
  .next-card b{color:var(--ink);font-family:var(--disp);font-weight:500;
    font-size:16px;letter-spacing:.02em}
  .next-card .in{color:var(--gold);font-family:var(--disp);font-weight:600}

  /* ---------- live panel: stats + timeline ---------- */
  .live-clock{font-family:var(--disp);font-weight:600}
  /* ESPN-style horizontal score card */
  .sc-comp{font-size:10.5px;color:var(--ink-dim);letter-spacing:.06em;
    text-transform:uppercase;text-align:center;margin-bottom:12px}
  .scorecard{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px}
  .sc-side{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
  .sc-side img,.sc-side .flag-fallback{width:46px;height:46px;border-radius:6px}
  .sc-name{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.02em;
    text-align:center;line-height:1.15}
  .sc-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 6px;min-width:88px}
  .sc-score{font-family:var(--disp);font-weight:700;font-size:38px;line-height:1;
    letter-spacing:.01em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
  .sc-dash{color:var(--ink-dim);font-size:24px;font-weight:400}
  .sc-clock{font-family:var(--disp);font-size:13px;font-weight:600;margin-top:7px;color:var(--ink-dim)}
  .sc-clock.live{color:var(--live);display:flex;align-items:center;gap:5px}
  .sc-clock.live::before{content:"";width:6px;height:6px;border-radius:50%;
    background:var(--live);animation:pulse 1.4s ease-in-out infinite}
  .sc-clock.delayed{color:var(--gold)}
  /* sticky mini-scoreboard (appears once the full card scrolls away) */
  .mini-bar{
    position:sticky;top:0;z-index:18;
    display:none;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(11,11,12,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--card-edge);
    padding:8px 16px;
  }
  .mini-bar.show{display:flex}
  .mini-side{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
  .mini-side.a{justify-content:flex-end}
  .mini-side img,.mini-side .flag-fallback{width:22px;height:22px;border-radius:3px}
  .mini-abbr{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.04em}
  .mini-mid{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}
  .mini-score{font-family:var(--disp);font-weight:700;font-size:18px;
    font-variant-numeric:tabular-nums;line-height:1}
  .mini-clock{font-family:var(--disp);font-size:10.5px;font-weight:600;color:var(--ink-dim)}
  .mini-clock.live{color:var(--live)}
  .mini-clock.delayed{color:var(--gold)}
  /* recent-form pips */
  .form{display:flex;gap:3px;margin-top:1px}
  .form .pip{width:6px;height:6px;border-radius:50%;background:var(--card-edge)}
  .form .pip.w{background:var(--pitch)}
  .form .pip.l{background:var(--live)}
  .form .pip.d{background:var(--ink-dim)}
  /* scorer / red-card summary line */
  .summary-line{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--card-edge);
    font-size:12.5px;color:var(--ink)}
  .summary-line .sl-item{font-family:var(--disp);font-weight:500;white-space:nowrap}
  .summary-line .sl-min{color:var(--gold);font-size:11px}
  .summary-line .card.sl{display:inline-block;width:8px;height:11px;border-radius:1px;vertical-align:-1px}
  /* match leaders — value beside name, category centered */
  .lead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:11px 0;font-size:13.5px}
  .lead + .lead{border-top:1px solid rgba(38,38,42,.55)}
  .lead-cat{font-size:10px;color:var(--ink-dim);text-transform:uppercase;
    letter-spacing:.07em;text-align:center;line-height:1.3;max-width:80px}
  .lead-side{display:flex;align-items:center;gap:8px;min-width:0}
  .lead-side.h{justify-content:flex-start}
  .lead-side.a{justify-content:flex-end}
  .lead-side .ln{font-family:var(--disp);font-weight:500;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .lead-side .lv{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--gold);
    font-variant-numeric:tabular-nums;flex:none}
  .lead-side .num{font-family:var(--disp);font-size:9.5px;color:var(--ink-dim);
    border:1px solid var(--card-edge);border-radius:4px;padding:1px 4px;flex:none}
  .panel{
    background:var(--card);border:1px solid var(--card-edge);
    border-radius:22px 10px 10px 10px;margin-bottom:14px;overflow:hidden;
  }
  .panel.live{border-color:var(--live)}
  .panel-sec{padding:13px 14px;border-top:1px solid var(--card-edge)}
  .panel-sec h3{
    font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-dim);margin-bottom:11px;
  }
  /* stat rows */
  .stat{margin-bottom:11px}
  .stat:last-child{margin-bottom:0}
  .stat .vals{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--disp);font-size:14px;margin-bottom:4px;
  }
  .stat .lbl{font-family:var(--body);font-size:10.5px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.06em}
  .stat .bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--card-edge)}
  .stat .bar .h{background:var(--pitch)}
  .stat .bar .a{background:var(--us);margin-left:auto}
  /* horizontal timeline axis */
  .tl-legend{display:flex;align-items:center;gap:10px;margin-bottom:10px;
    font-size:11px;color:var(--ink-dim)}
  .tl-team{display:flex;align-items:center;gap:6px;font-family:var(--disp)}
  .tl-team img,.tl-team .flag-fallback{width:20px;height:20px;border-radius:3px}
  .tl-team b{font-weight:600;font-size:13px;letter-spacing:.03em;color:var(--ink)}
  .tl-team.up{position:relative;padding-left:14px}
  .tl-team.up::before,.tl-team.down::before{content:"";position:absolute;left:0;
    width:8px;height:8px;border-radius:50%}
  .tl-team.up::before{background:var(--pitch)}
  .tl-team.down{position:relative;padding-left:14px;margin-left:auto}
  .tl-team.down::before{background:var(--us)}
  .tl-hint{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;opacity:.7}
  .tl-detail{
    font-family:var(--disp);font-size:13px;color:var(--ink);
    background:var(--card-edge);border-radius:8px;padding:8px 12px;margin-bottom:10px;
    min-height:18px;letter-spacing:.02em;
  }
  .tl-axis-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:2px}
  .tl-axis-wrap::-webkit-scrollbar{height:5px}
  .tl-axis-wrap::-webkit-scrollbar-thumb{background:var(--card-edge);border-radius:3px}
  .tl-axis{position:relative}
  .tl-line{position:absolute;left:0;right:0;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--pitch),var(--us));opacity:.55}
  .tl-tick{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;
    align-items:center;transform:translateX(-50%)}
  .tl-tickline{position:absolute;top:8px;bottom:8px;width:1px;
    background:var(--card-edge);opacity:.6}
  .tl-ticklbl{position:absolute;bottom:-2px;font-family:var(--disp);font-size:9.5px;
    font-weight:600;letter-spacing:.1em;color:var(--ink-dim)}
  .tl-mark{
    position:absolute;width:22px;height:22px;transform:translateX(-50%);
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--card-edge);border-radius:50%;
    font-size:12px;cursor:pointer;padding:0;color:var(--ink);
    -webkit-tap-highlight-color:transparent;transition:transform .12s,border-color .12s;
  }
  .tl-mark.goal{border-color:var(--gold);background:rgba(229,181,75,.12)}
  .tl-mark.sel{transform:translateX(-50%) scale(1.25);border-color:var(--gold);z-index:3}
  .tl-mark:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tl-mark .card{width:10px;height:14px;border-radius:1px;display:inline-block}
  .tl-mark .card.y{background:#F2C14E}
  .tl-mark .card.r{background:var(--live)}
  .tl-mark .sub-ic{color:var(--pitch);font-size:13px;line-height:1}
  .feed-note{
    background:rgba(229,181,75,.08);border:1px solid rgba(229,181,75,.3);
    border-radius:12px;padding:11px 14px;margin-bottom:11px;
    font-size:12px;color:var(--ink-dim);line-height:1.55;
  }
  .feed-note b{color:var(--gold);font-weight:600}

  /* ---------- date strip ---------- */
  .strip-wrap{position:sticky;top:0;z-index:19;background:var(--bg);
    box-shadow:0 10px 14px -10px rgba(0,0,0,.6);}
  .stage-rail{
    display:flex;overflow-x:auto;gap:6px;padding:4px 16px 12px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .stage-rail::-webkit-scrollbar{display:none}
  .stage-block{display:flex;flex-direction:column;gap:6px;flex:none}
  .stage-label{
    font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-dim);
    border-bottom:1px solid var(--card-edge);padding:0 2px 4px;
  }
  .stage-days{display:flex;gap:6px}
  .day{
    flex:none;width:46px;padding:7px 0 8px;border-radius:12px 12px 12px 4px;
    background:var(--card);border:1px solid var(--card-edge);
    text-align:center;cursor:pointer;color:var(--ink-dim);
    transition:background .15s,color .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .day .dow{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em}
  .day .num{font-family:var(--disp);font-size:18px;font-weight:600;line-height:1.15;color:var(--ink)}
  .day .mon{font-size:9px;text-transform:uppercase;letter-spacing:.08em}
  .day.sel{background:var(--gold);border-color:var(--gold)}
  .day.sel .num{color:#181203}
  .day.sel .dow,.day.sel .mon{color:#6E5519}
  .day.today:not(.sel){border-color:var(--gold)}
  .day:focus-visible{outline:2px solid var(--live);outline-offset:2px}

  /* ---------- match list ---------- */
  main{padding:14px 16px 56px;max-width:560px;margin:0 auto}
  .day-head{
    font-family:var(--disp);font-size:13px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);
    margin:6px 2px 12px;
  }
  .match{
    background:var(--card);border:1px solid var(--card-edge);
    border-radius:22px 10px 10px 10px;padding:13px 14px 12px;margin-bottom:11px;
  }
  .match.live{border-color:var(--live)}
  .match[data-expand]{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .match[data-expand]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .match.open{border-color:var(--gold)}
  .expand-tag{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:11px;padding-top:10px;border-top:1px solid var(--card-edge);
    font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-dim);
  }
  .expand-tag .chev{transition:transform .2s;font-size:13px;line-height:1}
  .expand-tag .chev.up{transform:rotate(180deg)}
  .match-detail{margin-top:12px}
  .match-detail .panel{margin-bottom:10px}
  .match-detail .panel:last-child{margin-bottom:0}
  .meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:10.5px;color:var(--ink-dim);margin-bottom:10px;
    letter-spacing:.06em;text-transform:uppercase;
  }
  .meta .state{font-weight:600}
  .meta .state.live{color:var(--live);display:flex;align-items:center;gap:5px}
  .meta .state.live::before{
    content:"";width:7px;height:7px;border-radius:50%;background:var(--live);
    animation:pulse 1.4s ease-in-out infinite;
  }
  .meta .state.ft{color:var(--final)}
  .meta .state.delayed{color:var(--gold);display:flex;align-items:center;gap:5px}
  .meta .state.delayed::before{content:"";width:7px;height:7px;border-radius:50%;
    background:var(--gold);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
  @media (prefers-reduced-motion:reduce){.meta .state.live::before{animation:none}}

  .row{display:flex;align-items:center;gap:10px;padding:4px 0}
  .row img{width:26px;height:26px;object-fit:contain;flex:none;border-radius:4px;background:rgba(255,255,255,.04)}
  .flag-fallback{
    width:26px;height:26px;flex:none;border-radius:4px;background:var(--card-edge);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-size:10px;color:var(--ink-dim);
  }
  .row .team{
    flex:1;font-family:var(--disp);font-weight:500;font-size:17px;
    letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .row .score{
    font-family:var(--disp);font-weight:700;font-size:21px;
    min-width:26px;text-align:right;font-variant-numeric:tabular-nums;
  }
  .row.loser .team,.row.loser .score{color:var(--ink-dim)}
  .ko{
    font-family:var(--disp);font-weight:600;font-size:16px;color:var(--gold);
    min-width:72px;text-align:right;
    border-left:1px solid var(--card-edge);margin-left:10px;
    align-self:stretch;display:flex;align-items:center;justify-content:flex-end;
  }
  .venue{font-size:11px;color:var(--ink-dim);margin-top:9px;
    border-top:1px solid var(--card-edge);padding-top:8px}

  /* ---------- standings ---------- */
  .group{
    background:var(--card);border:1px solid var(--card-edge);
    border-radius:22px 10px 10px 10px;margin-bottom:14px;overflow:hidden;
  }
  .group h2{
    font-family:var(--disp);font-size:15px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;
    padding:12px 14px 10px;border-bottom:1px solid var(--card-edge);
  }
  .trow{
    display:grid;
    grid-template-columns:16px 26px minmax(0,1fr) repeat(5,27px) 32px;
    gap:7px;align-items:center;
    padding:8px 12px 8px 9px;
    border-left:3px solid transparent;
  }
  .trow.head{
    padding-top:9px;padding-bottom:5px;
    font-size:10px;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;
  }
  .trow:not(.head){border-top:1px solid rgba(38,38,42,.65)}
  .trow.q{border-left-color:var(--pitch)}            /* top 2 — advance */
  .trow.q3{border-left-color:rgba(52,184,107,.4)}   /* 3rd — possible best-third */
  .trow .pos{font-family:var(--disp);font-size:12px;color:var(--ink-dim);text-align:center}
  .trow img{width:22px;height:22px;object-fit:contain;border-radius:3px;background:rgba(255,255,255,.04)}
  .trow .flag-fallback{width:22px;height:22px;font-size:9px}
  .trow .tname{
    font-family:var(--disp);font-weight:500;font-size:14.5px;letter-spacing:.02em;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .trow .n{
    font-family:var(--disp);font-size:13px;text-align:center;
    color:var(--ink-dim);font-variant-numeric:tabular-nums;
  }
  .trow .n.pts{color:var(--gold);font-weight:600;font-size:14px}
  .legend{
    font-size:10.5px;color:var(--ink-dim);margin:2px 2px 16px;line-height:1.6;
  }
  .legend .sw{display:inline-block;width:8px;height:8px;border-radius:2px;
    background:var(--pitch);margin-right:4px;vertical-align:baseline}
  .legend .sw.dim{background:rgba(52,184,107,.4)}

  /* ---------- states ---------- */
  .notice{
    text-align:center;color:var(--ink-dim);font-size:13.5px;
    padding:46px 24px;line-height:1.6;
  }
  .notice button{
    margin-top:14px;background:var(--gold);color:#181203;border:none;
    font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.05em;
    text-transform:uppercase;padding:10px 22px;border-radius:10px;cursor:pointer;
  }
  .skel{height:96px;border-radius:var(--radius);background:var(--card);
    margin-bottom:11px;animation:sk 1.2s ease-in-out infinite alternate}
  @keyframes sk{from{opacity:.45}to{opacity:.9}}
  footer{
    text-align:center;font-size:10.5px;color:var(--ink-dim);
    padding:0 24px 28px;line-height:1.7;max-width:560px;margin:0 auto;
  }
  .hide{display:none}
</style>
</head>
<body>

<header>
  <div class="masthead">
    <h1>World Cup <span class="yr">26</span></h1>
    <div class="sync" id="sync"><span class="dot"></span><span id="syncText">connecting…</span></div>
  </div>
  <div class="hosts">USA · Canada · Mexico — Jun 11 → Jul 19</div>
  <nav class="tabs" role="tablist">
    <button class="tab sel" id="tabMatches" role="tab" aria-selected="true">Matches</button>
    <button class="tab" id="tabLive" role="tab" aria-selected="false">Live<span class="badge" id="liveBadge"></span></button>
    <button class="tab" id="tabStandings" role="tab" aria-selected="false">Standings</button>
  </nav>
</header>

<div class="strip-wrap" id="stripWrap"><div class="stage-rail" id="rail"></div></div>

<div class="mini-bar" id="miniBar" aria-hidden="true"></div>

<main id="main">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
</main>

<footer>
  Live data from ESPN's public scoreboard feed. Kickoff times shown in your local timezone.
  Updates every 15–20 seconds while matches are live.
</footer>

<script>
"use strict";

/* ------------------------------------------------------------------ */
/*  Tournament calendar: Jun 11 – Jul 19 2026, grouped by stage        */
/* ------------------------------------------------------------------ */
const STAGES = [
  { label:"Group Stage",    from:"2026-06-11", to:"2026-06-27" },
  { label:"Round of 32",    from:"2026-06-28", to:"2026-07-03" },
  { label:"Round of 16",    from:"2026-07-04", to:"2026-07-08" },
  { label:"Quarter-finals", from:"2026-07-09", to:"2026-07-13" },
  { label:"Semi-finals",    from:"2026-07-14", to:"2026-07-17" },
  { label:"Finals",         from:"2026-07-18", to:"2026-07-20" },
];
const API_SCORES =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard"
  + "?dates=20260601-20260725&limit=400";
const API_STANDINGS =
  "https://site.api.espn.com/apis/v2/sports/soccer/fifa.world/standings?season=2026";
/* per-match detailed feed — updates live even when the scoreboard summary lags */
const summaryURL = id =>
  `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=${id}`;
const MATCH_MAX_MIN = 150;   // kickoff + stoppage + half-time: outer bound of "could still be live"

const $rail = document.getElementById("rail");
const $stripWrap = document.getElementById("stripWrap");
const $main = document.getElementById("main");
const $sync = document.getElementById("sync");
const $syncText = document.getElementById("syncText");
const $tabMatches = document.getElementById("tabMatches");
const $tabLive = document.getElementById("tabLive");
const $tabStandings = document.getElementById("tabStandings");
const $liveBadge = document.getElementById("liveBadge");
const $miniBar = document.getElementById("miniBar");
let miniObserver = null;
let miniEventId = null;
let expandedId = null;        // Matches-tab accordion: which match is expanded
let expandLoading = false;

let events = [];            // all tournament events from API
let groups = null;          // parsed standings groups
let view = "matches";       // "matches" | "standings"
let selectedKey = null;     // "YYYY-MM-DD" local-date key currently shown
let timer = null;           // full resync timer
let fastTimer = null;       // lightweight live poll
let inflight = false;

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const localKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => localKey(new Date());

function* eachDay(fromISO, toISO){
  const d = new Date(fromISO+"T12:00:00");
  const end = new Date(toISO+"T12:00:00");
  while(d <= end){ yield new Date(d); d.setDate(d.getDate()+1); }
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}
function fmtDayHead(key){
  return new Date(key+"T12:00:00").toLocaleDateString([],
    {weekday:"long", month:"long", day:"numeric"});
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function logoHTML(url, abbr, cls){
  return url
    ? `<img src="${esc(url)}" alt="" loading="lazy"
        onerror="this.outerHTML='<div class=&quot;flag-fallback ${cls||""}&quot;>${esc(abbr)}</div>'">`
    : `<div class="flag-fallback ${cls||""}">${esc(abbr)}</div>`;
}
/* Live clock that advances gently between polls. Feed gives e.g. "23'";
   we add elapsed wall-time since it arrived (capped at +2', snapped back
   on the next poll). Frozen at half-time and for "+" stoppage displays. */
function liveClockText(e){
  const st = e.status?.type || {};
  const disp = st.shortDetail || st.detail || "";
  if(st.state !== "in") return disp || "LIVE";
  const raw = st.displayClock || "";
  // freeze on half-time or stoppage-time formats we can't safely increment
  if(/ht|half/i.test(disp) || raw.includes("+") || !/^\d+'?$/.test(raw)) return disp || raw || "LIVE";
  const base = parseInt(raw, 10);
  if(isNaN(base)) return disp || "LIVE";
  const elapsedMin = e._clockAt ? Math.floor((Date.now() - e._clockAt)/60000) : 0;
  const shown = base + Math.min(2, Math.max(0, elapsedMin));
  return `${shown}'`;
}

/* ---------- tabs ---------- */
function setView(v){
  view = v;
  const map = { matches:$tabMatches, live:$tabLive, standings:$tabStandings };
  for(const [name, el] of Object.entries(map)){
    el.classList.toggle("sel", v===name);
    el.setAttribute("aria-selected", v===name);
  }
  $stripWrap.classList.toggle("hide", v!=="matches");
  if(v==="matches"){
    renderDay();
  } else if(v==="live"){
    renderLive();
    refreshLiveMatches();   // instant freshness on opening the tab
  } else {
    renderStandings();
    if(!groups) loadStandings();
  }
  if(events.length) scheduleNext();   // re-tune poll cadence for this tab
}
$tabMatches.addEventListener("click", ()=> setView("matches"));
$tabLive.addEventListener("click", ()=> setView("live"));
$tabStandings.addEventListener("click", ()=> setView("standings"));

function liveEvents(){
  return events.filter(e => e.status?.type?.state === "in");
}
function updateLiveBadge(){
  const ids = new Set(liveEvents().map(e=>e.id));
  events.filter(isFeedStale).forEach(e => ids.add(e.id));
  const n = ids.size;
  $tabLive.classList.toggle("has-live", n > 0);
  $liveBadge.textContent = n;
}

/* minutes since (or until, if negative) a match's scheduled kickoff */
function minsSinceKO(e){
  return (Date.now() - new Date(e.date)) / 60000;
}
/* a match the clock says should be underway (within the plausible match window) */
function shouldBeLive(e){
  const m = minsSinceKO(e);
  return m >= 0 && m <= MATCH_MAX_MIN && e.status?.type?.state !== "post";
}
/* feed insists a match is still 'pre' even though kickoff has clearly passed */
function isFeedStale(e){
  const m = minsSinceKO(e);
  return e.status?.type?.state === "pre" && m >= 2 && m <= MATCH_MAX_MIN;
}
/* which matches warrant fast per-match polling right now */
function matchesToPoll(){
  return events.filter(e =>
    e.status?.type?.state === "in" ||   // confirmed live
    shouldBeLive(e)                      // should be live (covers stale-feed case)
  );
}

/* ---------- date strip ---------- */
function buildRail(){
  const tk = todayKey();
  STAGES.forEach(stage=>{
    const block = document.createElement("div");
    block.className = "stage-block";
    block.innerHTML = `<div class="stage-label">${stage.label}</div>`;
    const days = document.createElement("div");
    days.className = "stage-days";
    for(const d of eachDay(stage.from, stage.to)){
      const key = localKey(d);
      const btn = document.createElement("button");
      btn.className = "day" + (key===tk ? " today" : "");
      btn.dataset.key = key;
      btn.setAttribute("aria-label", fmtDayHead(key));
      btn.innerHTML =
        `<div class="dow">${d.toLocaleDateString([], {weekday:"short"})}</div>`+
        `<div class="num">${d.getDate()}</div>`+
        `<div class="mon">${d.toLocaleDateString([], {month:"short"})}</div>`;
      btn.addEventListener("click", ()=> selectDay(key, true));
      days.appendChild(btn);
    }
    block.appendChild(days);
    $rail.appendChild(block);
  });
}

function selectDay(key, fromUser){
  selectedKey = key;
  expandedId = null;   // collapse any open accordion when changing day
  document.querySelectorAll(".day").forEach(b=>{
    b.classList.toggle("sel", b.dataset.key === key);
  });
  const sel = document.querySelector(".day.sel");
  if(sel) sel.scrollIntoView({inline:"center", block:"nearest",
    behavior: fromUser ? "smooth" : "auto"});
  if(view==="matches") renderDay();
}

/* ---------- data: scoreboard ---------- */
async function load(){
  try{
    const res = await fetch(API_SCORES, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    events = (data.events || []).slice()
      .sort((a,b)=> new Date(a.date) - new Date(b.date));
    $sync.classList.remove("stale");
    $syncText.textContent = "updated " +
      new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    updateLiveBadge();
    if(selectedKey===null){
      const tk = todayKey();
      const hasToday = document.querySelector(`.day[data-key="${tk}"]`);
      selectDay(hasToday ? tk : STAGES[0].from, false);
    } else if(view==="matches"){
      renderDay();
    }
    if(view==="live") renderLive();
    if(view==="standings") loadStandings();   // keep tables fresh too
  }catch(err){
    $sync.classList.add("stale");
    $syncText.textContent = "offline — retrying";
    if(!events.length && view==="matches"){
      $main.innerHTML = `<div class="notice">Couldn't reach the live feed.<br>
        Check your connection and try again.
        <br><button onclick="load()">Retry</button></div>`;
    }
  }
  scheduleNext();
}

function scheduleNext(){
  clearTimeout(timer);
  clearInterval(fastTimer);
  fastTimer = null;
  /* poll fast if anything is live, should-be-live, or kicking off very soon */
  const active = matchesToPoll().length > 0;
  const soon = events.some(e => {
    const m = minsSinceKO(e);
    return e.status?.type?.state === "pre" && m > -20 && m < 0;
  });
  if(active || soon){
    fastTimer = setInterval(refreshLiveMatches, view==="live" ? 10_000 : 15_000);
  }
  timer = setTimeout(load, 300_000);   // full tournament resync every 5 min
}

/* ------------------------------------------------------------------ */
/*  Per-match live poll — hits each match's detailed summary endpoint  */
/*  (updates live even when the aggregate scoreboard feed lags).        */
/* ------------------------------------------------------------------ */
async function refreshLiveMatches(){
  if(inflight || document.visibilityState !== "visible") return;
  const targets = matchesToPoll();
  if(!targets.length){ scheduleNext(); return; }
  inflight = true;
  let changed = false;
  try{
    const results = await Promise.allSettled(
      targets.map(e => fetch(summaryURL(e.id), {cache:"no-store"})
        .then(r => r.ok ? r.json() : null))
    );
    results.forEach((res, i) => {
      if(res.status !== "fulfilled" || !res.value) return;
      const merged = mergeSummary(targets[i], res.value);
      if(merged){
        const idx = events.findIndex(ev => ev.id === targets[i].id);
        if(idx >= 0){ events[idx] = merged; changed = true; }
      }
    });
    if(changed){
      updateLiveBadge();
      $sync.classList.remove("stale");
      $syncText.textContent = "updated " +
        new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
      if(view === "matches") renderDay();
      else if(view === "live") renderLive();
    }
  }catch(err){ /* quiet — the 5-min full resync surfaces hard errors */ }
  inflight = false;
}

/* Fold a /summary response into our scoreboard-shaped event object.
   The summary nests live status under header.competitions[0]; we copy the
   live bits (status, scores, scoring plays) onto the existing event so the
   renderers keep working unchanged. */
function mergeSummary(base, summary){
  try{
    const hdrComp = summary.header?.competitions?.[0];
    if(!hdrComp) return null;
    const e = JSON.parse(JSON.stringify(base));   // clone, don't mutate in place
    const comp = e.competitions?.[0];
    if(!comp) return null;

    // live status (state, clock, "45'+2", FT, etc.)
    if(hdrComp.status){
      comp.status = hdrComp.status;
      e.status = hdrComp.status;
    }
    // live scores, matched by competitor id
    const liveScores = {};
    (hdrComp.competitors||[]).forEach(c => { liveScores[c.id] = c.score; });
    (comp.competitors||[]).forEach(c => {
      if(liveScores[c.id] != null) c.score = liveScores[c.id];
    });
    // scoring plays + cards live under summary.keyEvents (or .commentary)
    const ev = summary.keyEvents || summary.scoringPlays || [];
    if(ev.length) comp.details = ev;

    // home/away id map for side assignment
    const homeId = String((comp.competitors||[]).find(c=>c.homeAway==="home")?.id
                 || (comp.competitors||[])[0]?.id || "");

    // ---- normalized timeline (Live tab) ----
    // team display names + abbreviations for attribution
    const teamName = {}, teamAbbr = {};
    (comp.competitors||[]).forEach(c => {
      teamName[String(c.id)] = c.team?.shortDisplayName || c.team?.displayName || "";
      teamAbbr[String(c.id)] = c.team?.abbreviation || "";
    });

    // pull a player name: prefer structured athlete, else parse from commentary text.
    // ESPN text reads like "Teboho Mokoena (South Africa) is shown the yellow card…"
    // or "Goal! Mexico 1, South Africa 0. Julián Quiñones (Mexico) left-footed…" —
    // the player name always sits immediately before " (Team)".
    const playerName = (k, txt) => {
      const a = k.athletesInvolved?.[0] || k.participants?.[0]?.athlete || k.participants?.[0];
      const fromObj = (a?.shortName || a?.displayName || a?.fullName || "").trim();
      if(fromObj) return fromObj;
      const m = txt.match(/([^.!?]+?)\s*\(/);   // text up to the first "(Team)"
      return m ? m[1].trim() : "";
    };

    e._timeline = (summary.keyEvents || []).map(k => {
      const t = (k.type?.text || k.type?.name || "").toLowerCase();
      const txt = (k.text || k.shortText || "").trim();
      const blob = (txt + " " + t).toLowerCase();
      const who = playerName(k, txt);
      const side = String(k.team?.id||"") === homeId ? "home" : "away";

      // classify — only the moments that matter survive the filter
      let kind = null, label = "", desc = "";
      if(k.scoringPlay || /\bgoal\b/.test(blob) && !/disallow|no goal|ruled out/.test(blob)){
        kind = k.ownGoal || /own goal/.test(blob) ? "og"
             : (k.penaltyKick || /penalty/.test(blob)) ? "pen" : "goal";
        label = who || "Goal";
        desc = teamName[String(k.team?.id||"")] || "";
        if(kind==="pen") desc += desc ? " · penalty" : "penalty";
        if(kind==="og")  desc += desc ? " · own goal" : "own goal";
      } else if(k.redCard || /red card|sent off|second (yellow|booking)|two yellow/.test(blob)){
        kind = "red"; label = who || "Red card"; desc = "Red card";
      } else if(k.yellowCard || /yellow card|booked|caution/.test(blob)){
        kind = "yellow"; label = who || "Yellow card"; desc = "Yellow card";
      } else if(/substitut/.test(blob)){
        kind = "sub"; label = who || "Substitution"; desc = "Substitution";
      } else if(/\bvar\b|video review|video assistant/.test(blob)){
        kind = "var"; label = "VAR review"; desc = txt.slice(0,60);
      } else if(/half ends|half-?time|end of (the )?first half/.test(blob)){
        kind = "period"; label = "Half-time";
      } else if(/full[- ]?time|match ends|second half ends|end of (the )?(second|2nd) half/.test(blob)){
        kind = "period"; label = "Full-time";
      }
      // everything else (delays, drinks breaks, generic commentary) → null → filtered out

      return {
        kind, label, desc,
        who,
        team: teamName[String(k.team?.id||"")] || "",
        teamAbbr: teamAbbr[String(k.team?.id||"")] || "",
        min: k.clock?.displayValue || "",
        side,
        order: typeof k.clock?.value === "number" ? k.clock.value
             : (kind==="period" && /full/.test(label) ? 1e9 : 0),
      };
    }).filter(x => x.kind);   // keep only goals, cards, subs, VAR, period markers

    // ---- compact scorer / red-card summary line (under the score) ----
    e._summaryLine = e._timeline
      .filter(x => ["goal","pen","og","red"].includes(x.kind))
      .sort((a,b)=> (a.order||0) - (b.order||0))   // chronological
      .map(x => ({ kind: x.kind, who: x.who || (x.kind==="red"?"Red card":"Goal"),
                   min: x.min, side: x.side }));

    // ---- normalized live stats (Live tab) ----
    const STAT_SET = [
      ["possessionPct","Possession"],
      ["totalShots","Shots"],
      ["shotsOnTarget","On target"],
      ["wonCorners","Corners"],
      ["foulsCommitted","Fouls"],
      ["offsides","Offsides"],
      ["yellowCards","Yellow cards"],
    ];
    const teamStats = (summary.boxscore?.teams || []);
    const byTeam = {};
    teamStats.forEach(ts => {
      const id = String(ts.team?.id||"");
      byTeam[id] = {};
      (ts.statistics||[]).forEach(s => {
        byTeam[id][s.name] = s.displayValue ?? s.value;
      });
    });
    const homeStats = byTeam[homeId] || {};
    const awayId = Object.keys(byTeam).find(k => k !== homeId);
    const awayStats = byTeam[awayId] || {};
    e._stats = STAT_SET.map(([name,label]) => {
      const h = homeStats[name], a = awayStats[name];
      if(h == null && a == null) return null;
      return { label, home: h ?? "0", away: a ?? "0", pct: name.endsWith("Pct") };
    }).filter(Boolean);

    // ---- match leaders (top performer per side) — best effort ----
    // ESPN nests these under summary.leaders[].leaders[] (by team). We pick a
    // curated set and degrade silently if the feed doesn't carry them.
    const LEADER_SET = [
      ["shots","Total shots"],
      ["passes","Accurate passes"],
      ["defensive","Defensive"],
      ["saves","Saves"],
    ];
    const leaderByTeam = {};   // teamId -> { categoryNameLower -> {who, num, val, sub} }
    (summary.leaders || []).forEach(group => {
      const tid = String(group.team?.id || "");
      leaderByTeam[tid] = {};
      (group.leaders || []).forEach(cat => {
        const key = (cat.name || cat.displayName || cat.shortDisplayName || "").toLowerCase();
        const top = cat.leaders?.[0];
        if(top){
          const ath = top.athlete || {};
          leaderByTeam[tid][key] = {
            who: ath.shortName || ath.displayName || "",
            num: ath.jersey || "",
            val: top.displayValue ?? top.value ?? "",
          };
        }
      });
    });
    const pickLeader = (tid, needles) => {
      const cats = leaderByTeam[tid] || {};
      for(const n of needles){
        const hit = Object.keys(cats).find(k => k.includes(n));
        if(hit) return cats[hit];
      }
      return null;
    };
    // category -> the substrings we'll accept in the feed's category names
    const LEADER_MATCH = {
      shots:["shot"], passes:["pass"],
      defensive:["defensive","tackle","intervention","clearance"], saves:["save"],
    };
    e._leaders = LEADER_SET.map(([key,label]) => {
      const h = pickLeader(homeId, LEADER_MATCH[key]);
      const a = pickLeader(awayId, LEADER_MATCH[key]);
      if(!h && !a) return null;
      return { label, home: h, away: a };
    }).filter(Boolean);

    // remember when we received this clock, for local ticking between polls
    e._clockAt = Date.now();
    return e;
  }catch(_){ return null; }
}

/* ---------- data: standings ---------- */
async function loadStandings(){
  try{
    const res = await fetch(API_STANDINGS, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const kids = (data.children || [])
      .filter(c => c.standings?.entries?.length);
    groups = kids.map(c => ({
      name: c.name || c.abbreviation || "",
      entries: c.standings.entries.map(en=>{
        const stat = n => {
          const s = (en.stats||[]).find(x => x.name === n);
          return s ? (s.displayValue ?? s.value ?? 0) : 0;
        };
        const team = en.team || {};
        return {
          name: team.shortDisplayName || team.displayName || "TBD",
          abbr: team.abbreviation || "—",
          logo: team.logos?.[0]?.href || team.logo || "",
          mp: stat("gamesPlayed"), w: stat("wins"), d: stat("ties"),
          l: stat("losses"), gd: stat("pointDifferential"), pts: stat("points"),
          rank: Number(stat("rank")) || 0,
        };
      }),
    })).sort((a,b)=> a.name.localeCompare(b.name));
    if(view==="standings") renderStandings();
  }catch(err){
    if(view==="standings" && !groups){
      $main.innerHTML = `<div class="notice">Couldn't load the standings.<br>
        Check your connection and try again.
        <br><button onclick="loadStandings()">Retry</button></div>`;
    }
  }
}

/* ---------- rendering: matches ---------- */
/* accordion: expand a match card into the full detail panel, fetching its
   summary on demand if we don't already have it (e.g. finished matches). */
async function toggleExpand(id){
  if(expandedId === id){ expandedId = null; renderDay(); return; }
  expandedId = id;
  const e = events.find(x => x.id === id);
  const needFetch = e && e._timeline === undefined &&
    ["in","post"].includes(e.status?.type?.state);
  expandLoading = needFetch;
  renderDay();
  // scroll the opened card into view
  const card = $main.querySelector(`[data-expand="${CSS.escape(String(id))}"]`);
  if(card) card.scrollIntoView({block:"nearest", behavior:"smooth"});

  if(needFetch){
    try{
      const res = await fetch(summaryURL(id), {cache:"no-store"});
      if(res.ok){
        const merged = mergeSummary(e, await res.json());
        if(merged){
          const i = events.findIndex(x => x.id === id);
          if(i >= 0) events[i] = merged;
        }
      } else {
        // mark as fetched-but-empty so we don't show a spinner forever
        if(e) e._timeline = e._timeline || [];
      }
    }catch(_){ if(e) e._timeline = e._timeline || []; }
    expandLoading = false;
    if(expandedId === id && view === "matches") renderDay();
  }
}

// event delegation for taps + keyboard on expandable cards
function showMarkDetail(mark){
  const chart = mark.closest(".tl-chart");
  if(!chart) return;
  const detail = chart.querySelector(".tl-detail");
  if(detail) detail.textContent = mark.dataset.detail || "";
  chart.querySelectorAll(".tl-mark.sel").forEach(m => m.classList.remove("sel"));
  mark.classList.add("sel");
}

$main.addEventListener("click", ev => {
  // timeline markers work on both tabs; handle first so they don't toggle the card
  const mark = ev.target.closest(".tl-mark");
  if(mark){ showMarkDetail(mark); return; }
  if(view !== "matches") return;
  // taps inside the expanded detail (stats/leaders/timeline) must not collapse the card
  if(ev.target.closest(".match-detail")) return;
  const card = ev.target.closest("[data-expand]");
  if(card) toggleExpand(card.dataset.expand);
});
$main.addEventListener("keydown", ev => {
  if(ev.key !== "Enter" && ev.key !== " ") return;
  const mark = ev.target.closest(".tl-mark");
  if(mark){ ev.preventDefault(); showMarkDetail(mark); return; }
  if(view !== "matches") return;
  if(ev.target.closest(".match-detail")) return;
  const card = ev.target.closest("[data-expand]");
  if(card){ ev.preventDefault(); toggleExpand(card.dataset.expand); }
});

function renderDay(){
  clearMiniBar();
  const dayEvents = events.filter(e => localKey(new Date(e.date)) === selectedKey);
  let html = `<div class="day-head">${fmtDayHead(selectedKey)}</div>`;

  if(!events.length){
    html += `<div class="skel"></div><div class="skel"></div>`;
  } else if(!dayEvents.length){
    html += `<div class="notice">No matches scheduled this day —<br>a rest day for the tournament.</div>`;
  } else {
    html += dayEvents.map(renderMatch).join("");
  }
  $main.innerHTML = html;
}

function renderMatch(e, withDetails){
  const comp = e.competitions?.[0] || {};
  const status = e.status?.type || {};
  const state = status.state;                       // pre | in | post
  const note = comp.notes?.[0]?.headline || "";
  const venue = comp.venue
    ? [comp.venue.fullName, comp.venue.address?.city].filter(Boolean).join(" · ")
    : "";

  const home = (comp.competitors||[]).find(c=>c.homeAway==="home") || (comp.competitors||[])[0];
  const away = (comp.competitors||[]).find(c=>c.homeAway==="away") || (comp.competitors||[])[1];
  if(!home || !away) return "";

  let stateHTML, right = null;
  const stale = isFeedStale(e);
  if(state === "in"){
    stateHTML = `<span class="state live"><span class="live-clock">${esc(liveClockText(e))}</span></span>`;
  } else if(state === "post"){
    stateHTML = `<span class="state ft">${esc(status.shortDetail || "FT")}</span>`;
  } else if(stale){
    stateHTML = `<span class="state delayed">In progress</span>`;
    right = fmtTime(e.date);
  } else {
    stateHTML = `<span class="state">Scheduled</span>`;
    right = fmtTime(e.date);
  }

  const done = state === "post";
  const teamRow = (t, opp, showScore) => {
    const team = t.team || {};
    const name = team.shortDisplayName || team.displayName || "TBD";
    const abbr = team.abbreviation || "—";
    const loser = done && Number(t.score??0) < Number(opp.score??0);
    return `<div class="row${loser?" loser":""}">
      ${logoHTML(team.logo, abbr)}<div class="team">${esc(name)}</div>
      ${showScore ? `<div class="score">${esc(t.score ?? "0")}</div>` : ""}
    </div>`;
  };

  /* goals + red cards, split home/away (Live tab only) */
  let detailsHTML = "";
  if(withDetails){
    const items = (comp.details || []).filter(d => d.scoringPlay || d.redCard);
    if(items.length){
      const side = id => String(id) === String(home.team?.id||home.id) ? "home" : "away";
      const cell = d => {
        const min = d.clock?.displayValue || "";
        const who = d.athletesInvolved?.[0]?.shortName
                 || d.athletesInvolved?.[0]?.displayName || "";
        if(d.redCard)
          return `<span class="rc">▮</span> ${esc(who)} <span class="min">${esc(min)}</span>`;
        const tag = d.ownGoal ? " (og)" : d.penaltyKick ? " (pen)" : "";
        return `⚽ ${esc(who)}${tag} <span class="min">${esc(min)}</span>`;
      };
      const h = items.filter(d=>side(d.team?.id)==="home")
        .map(d=>`<div class="g">${cell(d)}</div>`).join("");
      const a = items.filter(d=>side(d.team?.id)==="away")
        .map(d=>`<div class="g away">${cell(d)}</div>`).join("");
      detailsHTML = `<div class="scorers"><div>${h}</div><div>${a}</div></div>`;
    }
  }

  const showScores = state !== "pre";
  const state2 = e.status?.type?.state;
  const canExpand = state2 === "in" || state2 === "post";
  const isOpen = canExpand && expandedId === e.id;

  // inline detail (accordion) — only for live / finished matches
  let detailBlock = "";
  if(isOpen){
    if(e._timeline === undefined && expandLoading){
      detailBlock = `<div class="match-detail"><div class="skel" style="height:60px"></div></div>`;
    } else {
      const inner = statsPanelHTML(e) + leadersPanelHTML(e) + timelinePanelHTML(e);
      detailBlock = inner
        ? `<div class="match-detail">${inner}</div>`
        : `<div class="match-detail"><div class="notice" style="padding:20px">
             Detailed stats aren't available for this match.</div></div>`;
    }
  }

  return `<div class="match${state==="in"?" live":""}${isOpen?" open":""}"
       ${canExpand?`data-expand="${esc(e.id)}" role="button" tabindex="0"`:""}>
    <div class="meta"><span>${esc(note)}</span>${stateHTML}</div>
    <div style="display:flex;align-items:stretch">
      <div style="flex:1;min-width:0">
        ${teamRow(home, away, showScores)}
        ${teamRow(away, home, showScores)}
      </div>
      ${right ? `<div class="ko">${right}</div>` : ""}
    </div>
    ${detailsHTML}
    ${venue ? `<div class="venue">${esc(venue)}</div>` : ""}
    ${canExpand ? `<div class="expand-tag">${isOpen?"Hide details":"Match details"}
      <span class="chev${isOpen?" up":""}">▾</span></div>` : ""}
    ${detailBlock}
  </div>`;
}

/* ---------- rendering: live ---------- */
function statsPanelHTML(e){
  const stats = e._stats || [];
  if(!stats.length) return "";
  const rows = stats.map(s => {
    let hPct = 50;
    if(s.pct){
      hPct = parseFloat(String(s.home)) || 0;
    } else {
      const h = parseFloat(String(s.home))||0, a = parseFloat(String(s.away))||0;
      hPct = (h+a) > 0 ? (h/(h+a))*100 : 50;
    }
    const aPct = 100 - hPct;
    return `<div class="stat">
      <div class="vals"><span>${esc(s.home)}</span>
        <span class="lbl">${esc(s.label)}</span>
        <span>${esc(s.away)}</span></div>
      <div class="bar"><span class="h" style="width:${hPct.toFixed(1)}%"></span>
        <span class="a" style="width:${aPct.toFixed(1)}%"></span></div>
    </div>`;
  }).join("");
  return `<div class="panel"><div class="panel-sec" style="border-top:none">
    <h3>Match stats</h3>${rows}</div></div>`;
}

/* horizontal, scrollable match timeline: KO → HT → FT axis.
   Home events above the line, away below; markers tappable for detail. */
function timelinePanelHTML(e){
  const all = (e._timeline || []);
  const evs = all.filter(x => x.kind !== "period");
  if(!evs.length) return "";

  const comp = e.competitions?.[0] || {};
  const home = (comp.competitors||[]).find(c=>c.homeAway==="home") || (comp.competitors||[])[0];
  const away = (comp.competitors||[]).find(c=>c.homeAway==="away") || (comp.competitors||[])[1];

  // "9'" -> 9, "45'+4'" -> 49, "90'+2'" -> 92
  const parseMin = m => {
    const mm = String(m).match(/(\d+)'?(?:\+(\d+))?/);
    return mm ? parseInt(mm[1],10) + (mm[2]?parseInt(mm[2],10):0) : 0;
  };
  const items = evs.map(x => ({ ...x, n: parseMin(x.min) }))
    .sort((a,b)=> a.n - b.n);

  const maxN = Math.max(95, ...items.map(x=>x.n));
  const SCALE = 13, PAD_L = 20, PAD_R = 28, GAP = 26;
  const xOf = n => PAD_L + n * SCALE;
  const trackW = xOf(maxN) + PAD_R;

  // lane assignment per side to avoid overlap
  const lanes = { home: [], away: [] };
  const placed = items.map(x => {
    const arr = lanes[x.side] || (lanes[x.side] = []);
    const x0 = xOf(x.n);
    let lane = 0;
    while(arr[lane] !== undefined && x0 - arr[lane] < GAP) lane++;
    arr[lane] = x0;
    return { ...x, x0, lane };
  });
  const maxLane = s => Math.max(0, ...placed.filter(p=>p.side===s).map(p=>p.lane));
  const LANE_H = 26, BASE = 16, MK = 22, CENTER_PAD = 10, PAD_V = 12;
  const upH   = PAD_V + BASE + maxLane("home")*LANE_H + MK;
  const downH = BASE + maxLane("away")*LANE_H + MK + PAD_V;
  const centerY = upH + CENTER_PAD/2;
  const H = upH + downH + CENTER_PAD;

  const icon = k => ({
    goal:"⚽", pen:"⚽", og:"⚽",
    yellow:`<span class="card y"></span>`, red:`<span class="card r"></span>`,
    sub:`<span class="sub-ic">⇄</span>`, var:"▦",
  }[k] || "·");
  const kindWord = k => ({
    goal:"Goal", pen:"Penalty goal", og:"Own goal",
    yellow:"Yellow card", red:"Red card", sub:"Substitution", var:"VAR review",
  }[k] || "");

  const marks = placed.map(p => {
    const isUp = p.side === "home";
    const y = isUp
      ? centerY - CENTER_PAD/2 - (BASE + p.lane*LANE_H) - MK
      : centerY + CENTER_PAD/2 + (BASE + p.lane*LANE_H);
    const goalCls = ["goal","pen","og"].includes(p.kind) ? " goal" : "";
    const detail = [p.who || kindWord(p.kind), p.teamAbbr || p.team, kindWord(p.kind), p.min]
      .filter(Boolean).join(" · ");
    return `<button class="tl-mark${goalCls}" type="button"
        style="left:${p.x0}px;top:${y}px" data-detail="${esc(detail)}"
        aria-label="${esc(detail)}">${icon(p.kind)}</button>`;
  }).join("");

  // tick labels: KO, HT (≈45'), FT (end)
  const tick = (n, lbl) => `<div class="tl-tick" style="left:${xOf(n)}px">
      <span class="tl-tickline"></span><span class="tl-ticklbl">${lbl}</span></div>`;
  const ticks = tick(0,"KO") + tick(45,"HT") + tick(maxN, maxN>=90?"FT":"");

  const teamTag = (t, cls) => {
    const tm = t?.team || {};
    return `<span class="tl-team ${cls}">${logoHTML(tm.logo, tm.abbreviation||"—")}
      <b>${esc(tm.abbreviation||"")}</b></span>`;
  };

  return `<div class="panel"><div class="panel-sec" style="border-top:none">
    <h3>Timeline</h3>
    <div class="tl-legend">
      ${teamTag(home,"up")}<span class="tl-hint">tap a marker</span>${teamTag(away,"down")}
    </div>
    <div class="tl-chart">
      <div class="tl-detail">Tap any marker for details</div>
      <div class="tl-axis-wrap">
        <div class="tl-axis" style="width:${trackW}px;height:${H}px">
          <div class="tl-line" style="top:${centerY}px"></div>
          ${ticks}
          ${marks}
        </div>
      </div>
    </div>
  </div></div>`;
}

/* compact scorer / red-card line shown under the score card */
function summaryLineHTML(e){
  const items = e._summaryLine || [];
  if(!items.length) return "";
  const cell = x => {
    const ic = x.kind==="red" ? `<span class="card r sl"></span>` : "⚽";
    return `<span class="sl-item">${ic} ${esc(x.who)} <span class="sl-min">${esc(x.min)}</span></span>`;
  };
  return `<div class="summary-line">${items.map(cell).join("")}</div>`;
}

/* match leaders — ESPN style: centered category, value beside each name */
function leadersPanelHTML(e){
  const ls = e._leaders || [];
  if(!ls.length) return "";
  const sideH = p => p
    ? `<span class="lv">${esc(p.val||"")}</span>
       <span class="ln">${p.num?`<span class="num">${esc(p.num)}</span>`:""}${esc(p.who||"—")}</span>`
    : `<span class="lv"></span><span class="ln">—</span>`;
  const sideA = p => p
    ? `<span class="ln">${esc(p.who||"—")}${p.num?`<span class="num">${esc(p.num)}</span>`:""}</span>
       <span class="lv">${esc(p.val||"")}</span>`
    : `<span class="ln">—</span><span class="lv"></span>`;
  const rows = ls.map(l => `<div class="lead">
      <div class="lead-side h">${sideH(l.home)}</div>
      <div class="lead-cat">${esc(l.label)}</div>
      <div class="lead-side a">${sideA(l.away)}</div>
    </div>`).join("");
  return `<div class="panel"><div class="panel-sec" style="border-top:none">
    <h3>Match leaders</h3>${rows}</div></div>`;
}

function scorecardHTML(e, forSticky){
  const comp = e.competitions?.[0] || {};
  const home = (comp.competitors||[]).find(c=>c.homeAway==="home") || (comp.competitors||[])[0];
  const away = (comp.competitors||[]).find(c=>c.homeAway==="away") || (comp.competitors||[])[1];
  if(!home || !away) return "";
  const stale = isFeedStale(e);
  const live = e.status?.type?.state === "in";
  const clockTxt = stale ? "In progress" : liveClockText(e);
  const showScore = !stale;
  const clockCls = stale ? "delayed" : live ? "live" : "";

  if(forSticky){
    const mini = t => `${logoHTML(t.team?.logo, t.team?.abbreviation||"—")}
      <span class="mini-abbr">${esc(t.team?.abbreviation||"")}</span>`;
    return `<div class="mini-side">${mini(home)}</div>
      <div class="mini-mid">
        ${showScore ? `<span class="mini-score">${esc(home.score??"0")} – ${esc(away.score??"0")}</span>` : ""}
        <span class="mini-clock ${clockCls}">${esc(clockTxt)}</span>
      </div>
      <div class="mini-side a">${mini(away)}</div>`;
  }

  const formPips = f => !f ? "" : `<div class="form">` +
    [...String(f)].slice(-5).map(c => {
      const k = c==="W"?"w":c==="L"?"l":"d";
      return `<span class="pip ${k}"></span>`;
    }).join("") + `</div>`;
  const sideCol = t => {
    const team = t.team || {};
    const name = team.shortDisplayName || team.displayName || "TBD";
    return `<div class="sc-side">
      ${logoHTML(team.logo, team.abbreviation||"—")}
      <div class="sc-name">${esc(name)}</div>
      ${formPips(t.form)}
    </div>`;
  };
  return `<div class="scorecard">
    ${sideCol(home)}
    <div class="sc-mid">
      ${showScore ? `<div class="sc-score">${esc(home.score??"0")}<span class="sc-dash">–</span>${esc(away.score??"0")}</div>` : ""}
      <div class="sc-clock ${clockCls}">${esc(clockTxt)}</div>
    </div>
    ${sideCol(away)}
  </div>`;
}

function livePanelHTML(e){
  const comp = e.competitions?.[0] || {};
  const note = comp.notes?.[0]?.headline || "";
  const venue = comp.venue
    ? [comp.venue.fullName, comp.venue.address?.city].filter(Boolean).join(" · ") : "";
  if(!comp.competitors || comp.competitors.length < 2) return "";
  const stale = isFeedStale(e);
  const live = e.status?.type?.state === "in";

  // 1) standalone score-card panel (detached, own border) — observed for sticky bar
  const scorePanel = `<div class="panel score-panel ${live?"live":""}" data-live-card="${esc(e.id)}">
    <div class="panel-sec" style="border-top:none">
      ${note ? `<div class="sc-comp">${esc(note)}</div>` : ""}
      ${scorecardHTML(e, false)}
      ${stale ? "" : summaryLineHTML(e)}
    </div>
  </div>`;

  if(stale){
    return scorePanel;   // during stale window, just the card
  }

  // 2+) separate panels for the rest
  return scorePanel
    + statsPanelHTML(e)
    + leadersPanelHTML(e)
    + timelinePanelHTML(e)
    + (venue ? `<div class="panel"><div class="panel-sec" style="border-top:none">
        <div class="venue" style="border-top:none">${esc(venue)}</div></div></div>` : "");
}

/* sticky mini-scoreboard: show once the full score card scrolls out of view */
function clearMiniBar(){
  if(miniObserver){ miniObserver.disconnect(); miniObserver = null; }
  miniEventId = null;
  $miniBar.classList.remove("show");
  $miniBar.setAttribute("aria-hidden", "true");
  $miniBar.innerHTML = "";
}
function setupMiniBar(e){
  clearMiniBar();
  miniEventId = e.id;
  $miniBar.innerHTML = scorecardHTML(e, true);
  const card = $main.querySelector(`[data-live-card="${CSS.escape(String(e.id))}"]`);
  const IO = (typeof IntersectionObserver !== "undefined") ? IntersectionObserver : null;
  if(!card || !IO) return;
  // reveal the bar when the full card leaves the top of the viewport
  miniObserver = new IO(([entry]) => {
    const past = entry.boundingClientRect.bottom < (entry.rootBounds?.top ?? 0) + 4;
    $miniBar.classList.toggle("show", !entry.isIntersecting && past);
    $miniBar.setAttribute("aria-hidden", String(!(!entry.isIntersecting && past)));
  }, { rootMargin: "-1px 0px 0px 0px", threshold: 0 });
  miniObserver.observe(card);
}

function renderLive(){
  if(!events.length){
    $main.innerHTML = `<div class="skel"></div><div class="skel"></div>`;
    return;
  }
  const confirmed = liveEvents();
  const stale = events.filter(isFeedStale);
  const shown = [...confirmed, ...stale.filter(e => !confirmed.includes(e))]
    .sort((a,b)=> new Date(a.date) - new Date(b.date));

  if(shown.length){
    const n = shown.length;
    let html = `<div class="day-head">Live now · ${n} match${n>1?"es":""}</div>`;
    if(stale.length){
      html += `<div class="feed-note">⚠ <b>Data feed catching up.</b>
        ${stale.length>1?"Some matches have":"This match has"} kicked off, but
        ESPN's feed hasn't published the live clock and score yet — they'll fill in
        automatically once it does. Times shown are kickoff times.</div>`;
    }
    html += shown.map(livePanelHTML).join("");
    $main.innerHTML = html;
    setupMiniBar(shown[0]);   // pin the first (earliest) live match's score on scroll
    return;
  }

  clearMiniBar();

  /* genuinely nothing on — point to the next kickoff */
  const next = events.find(e =>
    e.status?.type?.state === "pre" && new Date(e.date) > Date.now());
  let html = `<div class="day-head">Live now</div>
    <div class="notice" style="padding:28px 24px 22px">No matches are being played right now.</div>`;
  if(next){
    const comp = next.competitions?.[0] || {};
    const names = (comp.competitors||[])
      .map(c => c.team?.shortDisplayName || "TBD").join(" vs ");
    const mins = Math.round((new Date(next.date) - Date.now())/60000);
    const inTxt = mins < 60 ? `${mins} min`
      : `${Math.floor(mins/60)}h ${pad(mins%60)}m`;
    const when = new Date(next.date).toLocaleString([],
      {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
    html += `<div class="next-card">Next kickoff in <span class="in">${inTxt}</span><br>
      <b>${esc(names)}</b><br>${esc(when)}</div>`;
  }
  $main.innerHTML = html;
}

/* ---------- rendering: standings ---------- */
function renderStandings(){
  clearMiniBar();
  if(!groups){
    $main.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
    return;
  }
  if(!groups.length){
    $main.innerHTML = `<div class="notice">Group tables aren't available yet.<br>
      They'll appear here once the feed publishes them.</div>`;
    return;
  }
  let html = `<div class="legend">
    <span class="sw"></span>Top two advance to the Round of 32&nbsp;&nbsp;
    <span class="sw dim"></span>Third place may advance among the 8 best
  </div>`;
  html += groups.map(g=>{
    const rows = g.entries.map((t,i)=>{
      const pos = t.rank || i+1;
      const qcls = pos<=2 ? " q" : pos===3 ? " q3" : "";
      return `<div class="trow${qcls}">
        <div class="pos">${pos}</div>
        ${logoHTML(t.logo, t.abbr)}
        <div class="tname">${esc(t.name)}</div>
        <div class="n">${esc(t.mp)}</div><div class="n">${esc(t.w)}</div>
        <div class="n">${esc(t.d)}</div><div class="n">${esc(t.l)}</div>
        <div class="n">${esc(t.gd)}</div><div class="n pts">${esc(t.pts)}</div>
      </div>`;
    }).join("");
    return `<section class="group">
      <h2>${esc(g.name)}</h2>
      <div class="trow head">
        <div></div><div></div><div>Team</div>
        <div class="n">MP</div><div class="n">W</div><div class="n">D</div>
        <div class="n">L</div><div class="n">GD</div><div class="n pts">Pts</div>
      </div>
      ${rows}
    </section>`;
  }).join("");
  $main.innerHTML = html;
}

/* ---------- go ---------- */
buildRail();
load();
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible") load();
});

/* gentle local clock tick — updates only the minute text, no network, no full re-render */
setInterval(()=>{
  if(document.visibilityState !== "visible") return;
  const live = liveEvents();
  if(!live.length) return;
  // Matches-tab cards
  document.querySelectorAll(".live-clock").forEach((el, i) => {
    if(live[i]) el.textContent = liveClockText(live[i]);
  });
  // Live-tab score-card clocks (skip stale/delayed ones)
  document.querySelectorAll(".sc-clock.live").forEach((el, i) => {
    if(live[i]) el.textContent = liveClockText(live[i]);
  });
  // sticky mini-bar clock
  if(miniEventId){
    const e = live.find(x => x.id === miniEventId);
    const mc = $miniBar.querySelector(".mini-clock.live");
    if(e && mc) mc.textContent = liveClockText(e);
  }
}, 1000);
</script>
